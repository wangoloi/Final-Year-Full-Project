name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  meal-plan-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Meal-Plan-System
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r backend/requirements.txt
      - name: Pytest Meal Plan API
        run: python -m pytest backend/tests -v

  clinical-backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clinical-Insulin-Recommendation
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt
      - name: Pytest Clinical
        run: python -m pytest tests/ -v

  meal-plan-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Meal-Plan-System/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Meal-Plan-System/frontend/package-lock.json
      - run: npm ci
      - run: npm run build

  clinical-frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: Clinical-Insulin-Recommendation/frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: Clinical-Insulin-Recommendation/frontend/package-lock.json
      - run: npm ci
      - run: npm run test
      - run: npm run build
