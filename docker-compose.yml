# Integrated GlucoSense (portal + clinical API) + Meal Plan (API + SPA)
#
# Usage (from this folder):
#   copy .env.deploy.example .env.deploy
#   # Edit .env.deploy — set JWT_SECRET and GLUCOSENSE_EMBED_KEY for anything beyond local demo
#   docker compose --env-file .env.deploy up --build
#
# URLs (host browser):
#   GlucoSense:     http://localhost:8080
#   Meal Plan UI:   http://localhost:8082
#   Meal Plan API:  http://localhost:8081  (SSO + direct API)
#
# VITE_* URLs are baked into the GlucoSense image at build time — they must match how users reach the services.

services:
  meal-api:
    build:
      context: ./Meal-Plan-System
      dockerfile: docker/Dockerfile.api
    ports:
      - "8081:8001"
    environment:
      APP_ENV: production
      STRICT_STARTUP_VALIDATION: "true"
      PORT: "8001"
      DATABASE_URL: sqlite:////data/glocusense.db
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.deploy}
      GLUCOSENSE_EMBED_KEY: ${GLUCOSENSE_EMBED_KEY:?Set GLUCOSENSE_EMBED_KEY in .env.deploy}
      CORS_EXTRA_ORIGINS: ${CORS_EXTRA_ORIGINS:-}
    volumes:
      - meal_api_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8001/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

  meal-web:
    build:
      context: ./Meal-Plan-System
      dockerfile: docker/Dockerfile.web
      args:
        VITE_ALLOWED_GLUCOSENSE_ORIGINS: ${PUBLIC_GLUCOSENSE_URL:-http://localhost:8080}
    ports:
      - "8082:80"
    depends_on:
      meal-api:
        condition: service_healthy

  glucosense:
    build:
      context: ./Clinical-Insulin-Recommendation
      dockerfile: Dockerfile
      args:
        VITE_MEAL_PLAN_URL: ${PUBLIC_MEAL_WEB_URL:-http://localhost:8082}
    ports:
      - "8080:8000"
    environment:
      GLUCOSENSE_API_KEY: ${GLUCOSENSE_API_KEY:-}
      CORS_ALLOW_ORIGINS: ${PUBLIC_GLUCOSENSE_URL:?Set PUBLIC_GLUCOSENSE_URL in .env.deploy},${PUBLIC_MEAL_WEB_URL:?Set PUBLIC_MEAL_WEB_URL in .env.deploy}
      # Internal URL for server-to-server SSO bridge
      MEAL_PLAN_API_URL: http://meal-api:8001
      MEAL_PLAN_JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET in .env.deploy}
      # Shared secret (server-side only)
      GLUCOSENSE_EMBED_KEY: ${GLUCOSENSE_EMBED_KEY:?Set GLUCOSENSE_EMBED_KEY in .env.deploy}
    volumes:
      - glucosense_outputs:/app/outputs
    depends_on:
      meal-api:
        condition: service_healthy
      meal-web:
        condition: service_healthy
    healthcheck:
      test:
        [
          "CMD",
          "python",
          "-c",
          "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health/ready', timeout=5)",
        ]
      interval: 15s
      timeout: 10s
      retries: 5
      start_period: 180s

volumes:
  meal_api_data:
  glucosense_outputs:
